<svg xmlns="http://www.w3.org/2000/svg" width="920" height="257" viewBox="0 0 920 257" role="img" aria-label="Bar chart of the table below: how many times faster oneyaml-go is than the strongest competitor on each task, log scale, higher is better. 6 tasks: 6 better, 0 level, 0 mixed, 0 worse, 0 not comparable.">
<title>oneyaml-go: speed per task against the strongest competitor</title><desc>oneyaml-go: speed per task against the strongest competitor. Times faster than the strongest competitor on each task (geometric mean over its workloads), log scale: bars to the right are faster, higher is better, bars to the left are slower. A † marks a cell measured differently from the task as specified. typed load 1.94× faster win (ours 121 µs vs 234 µs; workloads: 1 better, 0 level, 0 worse of 1); generic load 2.79× faster win (ours 48.1 µs vs 135 µs; workloads: 7 better, 0 level, 0 worse of 7); dump 12.0× faster win (ours 9.5 µs vs 114 µs; workloads: 6 better, 0 level, 0 worse of 6); document parse 4.81× faster win (ours 86.3 µs vs 415 µs; workloads: 3 better, 0 level, 0 worse of 3); edit script 20.7× faster win (ours 13.7 µs vs 284 µs; workloads: 2 better, 0 level, 0 worse of 2); patch (RFC 6902) 5.87× faster win (ours 15.7 µs vs 92.1 µs; workloads: 1 better, 0 level, 0 worse of 1).</desc>
